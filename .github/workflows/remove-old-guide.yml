name: Remove obsolete Quick Guide
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-old-guide.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: gh release delete-asset v1.5.2 Overtime-Travel-Quick-Guide-v1.5.1.pdf --yes
