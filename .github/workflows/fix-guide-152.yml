name: Correct v1.5.2 Quick Guide
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-guide-152.yml']
permissions:
  contents: write
jobs:
  replace-asset:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          set -eu
          html=Overtime-Travel-v1.5.2.html
          pdf=Overtime-Travel-Quick-Guide-v1.5.2.pdf
          gh release download v1.5.2 -p "$html" -p "$pdf"
          echo "5caba6830b7bfca4cc1b50a071fa4ea30bb011259b67f461ecba327f5307750f  $html" | sha256sum -c
          echo "41dc6cb4ed9061d340077d624b6d9f53b58d88bbcaf90be3967499c925cecd00  $pdf" | sha256sum -c
          python - <<'PY'
          import base64, re
          from pathlib import Path
          html = Path('Overtime-Travel-v1.5.2.html')
          pdf = Path('Overtime-Travel-Quick-Guide-v1.5.2.pdf')
          link = b'<a class="pdf-guide-link" href="data:application/pdf;base64,' + base64.b64encode(pdf.read_bytes()) + b'" download="' + pdf.name.encode() + '">Download the PDF guide (v1.5.2) ↓</a>'.encode()
          result, count = re.subn(rb'<a class="pdf-guide-link" href="data:application/pdf;base64,[^"]+" download="[^"]+">[^<]*</a>', lambda _: link, html.read_bytes())
          assert count == 1
          html.write_bytes(result)
          PY
          echo "88f6ab677757ec0f9de735a1a7ab70432f0fd47e4bc0de16deb7df5dd9cc6f6c  $html" | sha256sum -c
          gh release upload v1.5.2 "$html" --clobber
