name: Publish Overtime and Travel v1.5.3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-153.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          set -euo pipefail
          gh auth setup-git
          git clone "https://github.com/$GH_REPO.git" repo
          cd repo
          html=Overtime-Travel-v1.5.3.html
          pdf=Overtime-Travel-Quick-Guide-v1.5.3.pdf
          old=Overtime-Travel-v1.5.2.html
          gh release download v1.5.2 -p "$old" -D "$RUNNER_TEMP"
          echo "88f6ab677757ec0f9de735a1a7ab70432f0fd47e4bc0de16deb7df5dd9cc6f6c  $RUNNER_TEMP/$old" | sha256sum -c
          mkdir -p releases/v1.5.3
          python - <<'PY'
          import base64, json, os, re, zlib
          from pathlib import Path
          data = (Path(os.environ['RUNNER_TEMP']) / 'Overtime-Travel-v1.5.2.html').read_bytes()
          ops = json.loads(zlib.decompress(base64.b64decode(Path('.github/v153-release-payload.b64').read_bytes())))
          for start, end, payload in reversed(ops):
              data = data[:start] + base64.b64decode(payload) + data[end:]
          dest = Path('releases/v1.5.3')
          (dest / 'Overtime-Travel-v1.5.3.html').write_bytes(data)
          guide = re.search(rb'href="data:application/pdf;base64,([^"]+)" download="Overtime-Travel-Quick-Guide-v1.5.3.pdf"', data)
          (dest / 'Overtime-Travel-Quick-Guide-v1.5.3.pdf').write_bytes(base64.b64decode(guide[1], validate=True))
          PY
          echo "0cfed7781ee3cdd016c3814f83af1a8b009ff34aa0c56a7dbbb4f1c77fbc60b0  releases/v1.5.3/$html" | sha256sum -c
          echo "e1c3925a18a16af7d1d12a0fdb94040a494646d1f45990d6d19f3311b25c71f8  releases/v1.5.3/$pdf" | sha256sum -c
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          ## v1.5.3
          - Route overtime declarations for AST 1–4 to the HRM Portal while keeping travel time compensation available.
          - Add the linked AST 1–4 notice to the one-page Quick Guide.
          NOTES
          { cat "$RUNNER_TEMP/notes.md"; printf '\n'; cat CHANGELOG.md; } > "$RUNNER_TEMP/changelog.md"
          cp "$RUNNER_TEMP/changelog.md" CHANGELOG.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md releases/v1.5.3
          git rm .github/v153-release-payload.b64 .github/workflows/publish-153.yml
          git commit -m 'Release Overtime & Travel v1.5.3'
          git tag -a v1.5.3 -m 'Release v1.5.3' HEAD
          git push --atomic origin HEAD:main refs/tags/v1.5.3
          gh release create v1.5.3 "releases/v1.5.3/$html" "releases/v1.5.3/$pdf" --title 'Overtime & Travel v1.5.3' --notes-file "$RUNNER_TEMP/notes.md" --verify-tag --latest
